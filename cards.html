<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Arcana</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');
:root {
  --bg: #100b1a; --card-bg: #1a1028; --text: #d4c8b8; --text-secondary: #8a7e6b;
  --accent: #8b1a4a; --gold: #c9a84c; --purple: #5b2d8e;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Cinzel','Georgia',serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(150,110,160,0.20) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 0%, rgba(200,170,80,0.08) 0%, transparent 50%),
    repeating-conic-gradient(at 50% 0%, rgba(200,170,80,0.06) 0deg 0.5deg, transparent 0.5deg 3deg);
  color:var(--text); min-height:100vh;
  display:flex; flex-direction:column; align-items:center; padding:20px;
}
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:-1;
  border:1px solid rgba(201,168,76,0.06);
  margin:8px; border-radius:2px;
}
body::after {
  content:''; position:fixed; top:30px; left:50%; transform:translateX(-50%);
  width:200px; height:1px;
  background:linear-gradient(90deg, transparent, rgba(201,168,76,0.3), transparent);
  pointer-events:none; z-index:-1;
}
.footer-line {
  width:100%; max-width:960px; height:1px; margin-top:40px;
  background:linear-gradient(90deg, transparent, rgba(201,168,76,0.2), transparent);
}
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.75);
  display:none; align-items:center; justify-content:center; z-index:100;
}
.modal-overlay.show { display:flex; }
.modal-card {
  background:var(--card-bg); border-radius:8px; padding:32px 28px; text-align:center;
  width:280px; aspect-ratio: 1 / 1.618; border-width:2px;
}
.modal-card.mt0 { border-color:#4a5; box-shadow:0 0 30px rgba(68,170,85,0.3); }
.modal-card.mt1 { border-color:#48d; box-shadow:0 0 30px rgba(68,136,221,0.3); }
.modal-card.mt2 { border-color:#a5d; box-shadow:0 0 30px rgba(170,85,221,0.35); }
.modal-card.mt3 { border-color:var(--gold); box-shadow:0 0 40px rgba(201,168,76,0.35); }
.modal-card.mt4 { border-color:#d44; box-shadow:0 0 40px rgba(221,68,68,0.4); }
.modal-card.mt5 { border-color:var(--gold); box-shadow:0 0 50px rgba(255,255,255,0.3); animation:rainbow-border 2s linear infinite; }
.modal-card.mt6 { border-color:#91828f; box-shadow:0 0 30px rgba(145,130,143,0.3); }
@keyframes rainbow-border {
  0%   { border-color:#f44; box-shadow:0 0 40px rgba(255,68,68,0.4); }
  25%  { border-color:#fa0; box-shadow:0 0 40px rgba(255,170,0,0.4); }
  50%  { border-color:#4f4; box-shadow:0 0 40px rgba(68,255,68,0.4); }
  75%  { border-color:#48f; box-shadow:0 0 40px rgba(68,136,255,0.4); }
  100% { border-color:#f4f; box-shadow:0 0 40px rgba(255,68,255,0.4); }
}
.modal-img { max-width:260px; border-radius:6px; margin-bottom:12px; box-shadow:0 0 30px rgba(201,168,76,0.3); }
.modal-name { font-size:16px; font-weight:700; letter-spacing:2px; margin-bottom:8px; }
.modal-count { font-size:13px; margin-bottom:4px; }
.modal-time { font-size:11px; color:var(--text-secondary); }
.modal-meaning { font-size:11px; color:var(--text-secondary); margin-top:12px; line-height:1.6; max-height:180px; overflow-y:auto; border-top:1px solid rgba(201,168,76,0.15); padding-top:10px; text-align:left; }
.modal-meaning::-webkit-scrollbar { width:3px; }
.modal-meaning::-webkit-scrollbar-thumb { background:rgba(201,168,76,0.3); border-radius:2px; }
.md-desc { color:var(--text); font-style:italic; margin-bottom:10px; }
.md-title { color:var(--gold); font-size:10px; letter-spacing:2px; text-transform:uppercase; margin:8px 0 2px; font-style:normal; }
.md-text { color:var(--text-secondary); font-style:normal; }
#logModal .modal-card::-webkit-scrollbar { width:4px; }
#logModal .modal-card::-webkit-scrollbar-track { background:rgba(13,13,26,0.5); border-radius:2px; }
#logModal .modal-card::-webkit-scrollbar-thumb { background:linear-gradient(180deg, rgba(201,168,76,0.4), rgba(139,26,74,0.4)); border-radius:2px; }
#logModal .modal-card::-webkit-scrollbar-thumb:hover { background:linear-gradient(180deg, rgba(201,168,76,0.6), rgba(139,26,74,0.6)); }
h1 {
  margin:20px 0 4px; font-size:28px; font-weight:700; letter-spacing:6px;
  color:var(--gold); text-shadow:0 0 20px rgba(201,168,76,0.3);
}
.subtitle { font-size:11px; color:var(--text-secondary); letter-spacing:3px; margin-bottom:20px; }
.stats-bar {
  display:flex; align-items:center; gap:16px; margin-bottom:24px;
  font-size:12px; color:var(--text-secondary); letter-spacing:2px;
}
.stats-bar b { color:var(--gold); font-size:16px; }
.btn {
  padding:6px 18px; border:1px solid rgba(201,168,76,0.15); border-radius:2px;
  background:transparent; color:rgba(201,168,76,0.4); cursor:pointer;
  font-family:inherit; font-size:10px; letter-spacing:3px; transition:all 0.4s; text-transform:uppercase;
}
.btn:hover { border-color:var(--gold); color:var(--gold); box-shadow:0 0 8px rgba(201,168,76,0.1); }
.cards-grid { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:960px; padding-bottom:60px; }
.card {
  width:86px; height:130px; border-radius:4px; display:flex;
  flex-direction:column; align-items:center; justify-content:center;
  text-align:center; transition:all 0.5s; cursor:default;
  background:var(--card-bg);
  border:1px solid #1a1a2e; position:relative;
}
.card::before {
  content:''; position:absolute; inset:3px; border:1px solid #1a1a2e;
  border-radius:2px; pointer-events:none;
}
.card { transition:all 0.5s; }
.card:hover { transform:translateY(-3px); }
.card::before { border-color:rgba(201,168,76,0.3); }
.card.major { width:96px; height:145px; }
/* tier border (all cards) */
.card.t0 { border-color:#4a5; }
.card.t1 { border-color:#48d; }
.card.t2 { border-color:#a5d; }
.card.t3 { border-color:var(--gold); }
.card.t4 { border-color:#d44; }
.card.t5 { animation:rainbow 2s linear infinite; }
/* tier glow (owned only) */
.card.t0.owned { box-shadow:0 0 24px rgba(68,170,85,0.5), 0 0 8px rgba(68,170,85,0.4), inset 0 0 12px rgba(68,170,85,0.1); }
.card.t0.owned:hover { box-shadow:0 0 38px rgba(68,170,85,0.7), 0 0 14px rgba(68,170,85,0.5); }
.card.t1.owned { box-shadow:0 0 24px rgba(68,136,221,0.5), 0 0 8px rgba(68,136,221,0.4), inset 0 0 12px rgba(68,136,221,0.1); }
.card.t1.owned:hover { box-shadow:0 0 38px rgba(68,136,221,0.7), 0 0 14px rgba(68,136,221,0.5); }
.card.t2.owned { box-shadow:0 0 26px rgba(170,85,221,0.55), 0 0 10px rgba(170,85,221,0.4), inset 0 0 14px rgba(170,85,221,0.1); }
.card.t2.owned:hover { box-shadow:0 0 42px rgba(170,85,221,0.75), 0 0 16px rgba(170,85,221,0.55); }
.card.t3.owned { box-shadow:0 0 30px rgba(201,168,76,0.55), 0 0 10px rgba(201,168,76,0.4), inset 0 0 14px rgba(201,168,76,0.1); }
.card.t3.owned:hover { box-shadow:0 0 46px rgba(201,168,76,0.75), 0 0 18px rgba(201,168,76,0.55); }
.card.t4.owned { box-shadow:0 0 34px rgba(221,68,68,0.6), 0 0 12px rgba(221,68,68,0.45), inset 0 0 16px rgba(221,68,68,0.12); }
.card.t4.owned:hover { box-shadow:0 0 50px rgba(221,68,68,0.8), 0 0 20px rgba(221,68,68,0.6); }
.card.t5.owned { box-shadow:0 0 40px rgba(255,255,255,0.5), 0 0 16px rgba(255,255,255,0.3); animation:rainbow 4s linear infinite; }
.card.t5.owned:hover { box-shadow:0 0 56px rgba(255,255,255,0.7), 0 0 22px rgba(255,255,255,0.5); filter:brightness(1.3); }
@keyframes rainbow {
  0%   { border-color:#f44; }  14%  { border-color:#fa0; }  28%  { border-color:#ff4; }
  42%  { border-color:#4f4; }  57%  { border-color:#48f; }  71%  { border-color:#a4f; }
  85%  { border-color:#f4f; }  100% { border-color:#f44; }
}
@keyframes rainbow-dim {
  0%   { border-color:#622; }  14%  { border-color:#640; }  28%  { border-color:#662; }
  42%  { border-color:#262; }  57%  { border-color:#226; }  71%  { border-color:#426; }
  85%  { border-color:#626; }  100% { border-color:#622; }
}
.card.t5 { animation:rainbow-dim 4s linear infinite; }
.card.t5.owned { animation:rainbow 4s linear infinite; }
.card.t6 { border-color:#91828f; }
.card.locked.t6 { border-color:#4a3f48; }
.card.t6.owned { box-shadow:0 0 28px rgba(145,130,143,0.45), 0 0 10px rgba(130,115,128,0.35), inset 0 0 14px rgba(130,115,128,0.1); }
.card.t6.owned:hover { box-shadow:0 0 40px rgba(160,150,158,0.6), 0 0 16px rgba(145,130,143,0.45); }
.card-icon { font-size:22px; color:var(--gold); margin-bottom:4px; z-index:1; min-height:28px; display:flex; align-items:center; }
.card-img { width:100%; height:100%; object-fit:cover; border-radius:4px; position:absolute; inset:0; z-index:0; }
.card-back { width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, #1a1028 0%, #2a1550 50%, #1a1028 100%);
  border:2px solid #2a2040; border-radius:4px; font-size:32px; color:rgba(201,168,76,0.15); position:absolute; inset:0; z-index:0; }
.card-name { font-size:8px; letter-spacing:1px; line-height:1.3; z-index:2; padding:0 4px; position:relative; background:rgba(0,0,0,0.7); margin-top:auto; width:100%; text-align:center; padding:2px 4px; }
.card.locked.t0 { border-color:#174; }
.card.locked.t1 { border-color:#147; }
.card.locked.t2 { border-color:#539; }
.card.locked.t3 { border-color:#6b5a28; }
.card.locked.t4 { border-color:#733; }
.card.locked.t5 { border-color:#6b5a28; }
.card.locked .card-icon { color:rgba(180,160,200,0.2); }
.card.locked .card-name { color:rgba(180,160,200,0.35); }
.section-title {
  width:100%; text-align:center; font-size:13px; font-weight:700; letter-spacing:4px;
  margin:28px 0 10px; color:var(--accent); text-transform:uppercase;
  display:flex; align-items:center; justify-content:center; gap:16px;
}
.section-title::before, .section-title::after {
  content:''; height:1px; width:60px;
  background:linear-gradient(90deg, transparent, rgba(139,26,74,0.5), transparent);
}
.suit-title {
  width:100%; text-align:center; font-size:11px; letter-spacing:3px;
  color:rgba(180,160,200,0.7); margin:16px 0 6px; text-transform:uppercase;
}
</style>
</head>
<body>
<h1>THE ARCANUM</h1>
<div class="subtitle">TAROT COLLECTION</div>
<div class="stats-bar">
  <span>Collected: <b id="collectedCount">0</b></span>
  <button class="btn" id="logBtn">Log</button>
  <button class="btn" id="resetCards">Reset</button>
</div>
<div class="cards-grid" id="cardsGrid"></div>

<div class="modal-overlay" id="logModal">
  <div class="modal-card" style="max-width:400px;max-height:70vh;overflow-y:auto">
    <div class="modal-name" style="margin-bottom:12px">Drop Log</div>
    <div id="logContent"></div>
  </div>
</div>
<div class="footer-line"></div>

<div class="modal-overlay" id="cardModal">
  <div class="modal-card">
    <img class="modal-img" id="modalImg" src="" alt="">
    <div class="modal-name" id="modalName"></div>
    <div class="modal-count" id="modalCount"></div>
    <div class="modal-time" id="modalTime"></div>
    <div class="modal-meaning" id="modalMeaning"></div>
  </div>
</div>

<script>
const ROMAN = ['0','I','II','III','IV','V','VI','VII','VIII','IX','X'];
const ALL_CARDS = [
  'The Fool','The Magician','The High Priestess','The Empress','The Emperor','The Hierophant','The Lovers','The Chariot',
  'Strength','The Hermit','Wheel of Fortune','Justice','The Hanged Man','Death','Temperance','The Devil',
  'The Tower','The Star','The Moon','The Sun','Judgement','The World',
  'Ace of Wands','II of Wands','III of Wands','IV of Wands','V of Wands','VI of Wands','VII of Wands','VIII of Wands','IX of Wands','X of Wands','Page of Wands','Knight of Wands','Queen of Wands','King of Wands',
  'Ace of Cups','II of Cups','III of Cups','IV of Cups','V of Cups','VI of Cups','VII of Cups','VIII of Cups','IX of Cups','X of Cups','Page of Cups','Knight of Cups','Queen of Cups','King of Cups',
  'Ace of Swords','II of Swords','III of Swords','IV of Swords','V of Swords','VI of Swords','VII of Swords','VIII of Swords','IX of Swords','X of Swords','Page of Swords','Knight of Swords','Queen of Swords','King of Swords',
  'Ace of Pentacles','II of Pentacles','III of Pentacles','IV of Pentacles','V of Pentacles','VI of Pentacles','VII of Pentacles','VIII of Pentacles','IX of Pentacles','X of Pentacles','Page of Pentacles','Knight of Pentacles','Queen of Pentacles','King of Pentacles',
];
const MAJOR_COUNT = 22;
function getTier(idx) {
  if (idx === 0 || idx === 21) return 5; // Fool, World: rainbow
  if ([10,19].includes(idx)) return 4; // Wheel, Sun: red
  if ([13,15,16].includes(idx)) return 6; // Death, Devil, Tower: obsidian
  if (idx < 22) return 3; // other Major: gold
  const r = (idx - 22) % 14;
  if (r < 10) return 0; // Number: green
  if (r < 12) return 1; // Page/Knight: blue
  return 2; // Queen/King: purple
}

function loadCards() {
  try { return JSON.parse(localStorage.getItem('pomodoro_cards')||'{}'); } catch(e) { return {}; }
}
function getSuit(name) {
  if (name.includes('Wands')) return 'Wands';
  if (name.includes('Cups')) return 'Cups';
  if (name.includes('Swords')) return 'Swords';
  if (name.includes('Pentacles')) return 'Pentacles';
  return '';
}
function getCardImage(idx) { return 'cards/' + idx + '.jpg'; }
function render() {
  const data = loadCards();
  const all = data.cards||[];
  const counts = {};
  const latest = {};
  all.forEach(c => {
    const id = typeof c === 'string' ? c : c.id;
    counts[id] = (counts[id]||0) + 1;
    if (c.time && (!latest[id] || c.time > latest[id])) latest[id] = c.time;
  });
  document.getElementById('collectedCount').textContent = all.length;
  let html = '<div class="section-title">Major Arcana</div>';
  let lastSuit = '';
  ALL_CARDS.forEach((name, i) => {
    const id = 'card_'+i;
    const cnt = counts[id]||0;
    const have = cnt > 0;
    const isMajor = i < MAJOR_COUNT;
    const suit = getSuit(name);
    if (suit && suit !== lastSuit) {
      lastSuit = suit;
      html += `<div class="suit-title">${suit}</div>`;
    }
    const roman = cnt > 0 && cnt <= 10 ? ROMAN[cnt] : (cnt || '');
    const tier = getTier(i);
    html += `<div class="card${isMajor?' major':''} t${tier}${have?' owned':' locked'}" data-name="${name}" data-count="${cnt}" data-latest="${latest[id]||''}">
      ${have ? `<img src="${getCardImage(i)}" class="card-img" onerror="this.style.display='none'" alt="">` : '<div class="card-back">&#x2726;</div>'}
      <div class="card-name">${name}</div>
    </div>`;
  });
  document.getElementById('cardsGrid').innerHTML = html;
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const cnt = parseInt(card.dataset.count)||0;
      const latest = card.dataset.latest;
      const name = card.dataset.name;
      if (cnt === 0) return;
      const t = latest ? new Date(parseInt(latest)) : null;
      const timeStr = t ? t.toLocaleString() : 'unknown';
      const idx = ALL_CARDS.indexOf(name);
      document.getElementById('modalImg').src = idx >= 0 ? getCardImage(idx) : '';
      const tier = idx >= 0 ? getTier(idx) : 0;
      const mc = document.querySelector('#cardModal .modal-card');
      mc.className = 'modal-card mt' + tier;
      const TEXT_COLORS = ['#4a5','#48d','#c8f','var(--gold)','#f66','#fff','#91828f'];
      document.getElementById('modalName').textContent = name;
      document.getElementById('modalName').style.color = TEXT_COLORS[tier];
      document.getElementById('modalCount').style.color = TEXT_COLORS[tier];
      const roman = cnt > 0 && cnt <= 10 ? ROMAN[cnt] : cnt;
      document.getElementById('modalCount').textContent = 'Owned: ' + roman;
      document.getElementById('modalTime').textContent = 'Last: ' + timeStr;
      const meaningEl = document.getElementById('modalMeaning');
      meaningEl.innerHTML = '';
      const text = MEANING_DATA[idx] || '';
      const matchDesc = text.match(/\*\*1\.\s*.*?\*\*\s*([\s\S]*?)(?=\*\*2\.|\*\*3\.|$)/);
      const matchUp = text.match(/\*\*2\.\s*.*?\*\*\s*([\s\S]*?)(?=\*\*3\.|$)/);
      const matchRev = text.match(/\*\*3\.\s*.*?\*\*\s*([\s\S]*)/);
      const desc = matchDesc ? matchDesc[1].trim() : '';
      const up = matchUp ? matchUp[1].trim() : '';
      const rev = matchRev ? matchRev[1].trim() : '';
      if (desc || up || rev) {
        meaningEl.innerHTML = '<div class=\"md-desc\">'+desc+'</div><div class=\"md-title\">Upright</div><div class=\"md-text\">'+up+'</div><div class=\"md-title\">Reversed</div><div class=\"md-text\">'+rev+'</div>';
      }
      document.getElementById('cardModal').classList.add('show');
    });
  });
  document.getElementById('cardModal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
  });
}
render();
// 掉落记录弹窗
document.getElementById('logBtn').addEventListener('click', () => {
  const data = loadCards();
  const all = data.cards||[];
  const items = [...all].reverse().slice(0, 200);
  const fmt = ts => ts ? new Date(ts).toLocaleString() : '-';
  const html = items.length === 0 ? '<div style="color:var(--text-secondary);font-size:11px">No drops yet</div>' :
    items.map(c => {
      const idx = parseInt((typeof c === 'string' ? c : c.id).replace('card_',''));
      const name = ALL_CARDS[idx] || 'Unknown';
      const time = c.time ? fmt(c.time) : '-';
      const LOG_COLORS = ['#4a5','#48d','#c8f','var(--gold)','#f66','#fff'];
      const tc = LOG_COLORS[idx >= 0 ? getTier(idx) : 0];
      return `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:10px;color:var(--text);border-bottom:1px solid rgba(201,168,76,0.08)"><span style="color:${tc};font-weight:600">${name}</span><span style="color:rgba(201,168,76,0.5);font-size:9px;margin-left:12px">${time}</span></div>`;
    }).join('');
  document.getElementById('logContent').innerHTML = html;
  document.getElementById('logModal').classList.add('show');
});
document.getElementById('logModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});
document.getElementById('resetCards').addEventListener('click', () => {
  if (confirm('Reset all collected cards?')) {
    localStorage.setItem('pomodoro_cards', JSON.stringify({ dropRate: 1 }));
    render();
  }
});
window.addEventListener('storage', (e) => {
  if (e.key === 'pomodoro_cards') render();
});
</script>

<script>const MEANING_DATA={"0": "**1. Visual Description**  \nA young figure stands at the edge of a cliff, facing forward with a light pack on a staff, a small white dog jumping at their heel. They wear a colorful, jester-like tunic, and a feather adorns their hair. The bright sun shines above, and snow-capped mountains rise in the background—symbolizing pure potential, unawareness of danger, and the spontaneous beginning of a journey.\n\n**2. Upright Meaning**  \nInnocence, fresh starts, spontaneity, and boundless faith in the universe. The Fool represents a leap into the unknown without fear or calculation—trusting instinct over experience, and embracing the present moment fully. It advises the querent to release rigid plans, follow their heart, and embark on a new venture with open curiosity, though it also cautions against naivety or recklessness disguised as freedom.\n\n**3. Reversed Meaning**  \nReversed, the Fool signals foolishness, risk-taking without grounding, or a refusal to learn from past mistakes. It may indicate hesitation, self-doubt, or a paralysis that prevents any leap at all—fear of the unknown overriding potential. Alternatively, it points to carelessness, irresponsibility, or escapism, urging the querent to pause, assess consequences, and distinguish between courageous trust and willful ignorance.", "1": "**1. Visual Description**  \nA figure stands behind a table bearing four symbolic tools—cup, sword, wand, and pentacle—one hand raised toward the heavens, the other pointing to the earth. They wear a white robe and red cloak, with a serpent biting its own tail (ouroboros) as a belt, and lilies and roses bloom below. Above their head floats an infinity symbol, and a caduceus-like staff rests on the table—all representing the conscious channeling of divine energy into material form.\n\n**2. Upright Meaning**  \nMastery, resourcefulness, and active manifestation—the Magician unites will, skill, and the four elements to turn potential into reality. It signifies that the querent possesses all necessary tools and abilities to achieve their goal, provided they focus intent, take deliberate action, and trust their competence. This card encourages initiative, clear communication, and the ethical use of power, reminding that conscious awareness aligns inner vision with outer results.\n\n**3. Reversed Meaning**  \nReversed, the Magician indicates manipulation, trickery, or untapped potential—the querent may have the tools but lacks direction, confidence, or integrity. It warns of illusion, self-deception, or using skills for selfish or deceptive ends, leading to scattered energy and failed outcomes. Alternatively, it points to creative block, procrastination, or a disconnect between thought and action, urging the querent to reassess motives, ground their ambition, and avoid shortcuts that compromise authenticity.", "2": "**1. Visual Description**  \nA serene woman sits between two pillars—one black (Boaz) and one white (Jachin)—with a veil embroidered with pomegranates behind her. She wears a blue robe and a crown with a crescent moon, and holds a scroll partly concealed by her robe, bearing the letters TORA. Her feet rest on a crescent moon, and she sits before a calm body of water—all evoking mystery, intuition, and the threshold between conscious and subconscious realms.\n\n**2. Upright Meaning**  \nInner knowing, silence, and deep subconscious wisdom—the High Priestess represents the passive, receptive principle of intuition over logic. She urges the querent to trust their inner voice, wait for clarity rather than force action, and explore hidden truths through meditation, dreams, and subtle perception. This card signals that answers are not yet ready to be spoken; patience and stillness are required to access knowledge that lies beyond rational thought.\n\n**3. Reversed Meaning**  \nReversed, the High Priestess indicates suppressed intuition, emotional withdrawal, or a refusal to listen to inner guidance—leading to confusion, denial, or superficiality. It may manifest as secrets being revealed against one's will, or the querent ignoring strong gut feelings out of fear or over-reliance on external authority. Alternatively, it warns of being lost in fantasy, passivity, or withholding information, urging a reconnection with authentic feeling and a conscious opening to the unseen dimensions of experience.", "3": "**1. Visual Description**  \nA voluptuous, regal woman seated on a throne amid abundant grain fields and lush forests, wearing a crown of twelve stars and a flowing gown decorated with pomegranates. She holds a scepter in one hand and rests the other on her lap, with a heart-shaped shield bearing the symbol of Venus leaning against her throne. A flowing river meanders behind her—representing fertility, sensuality, and the nurturing abundance of nature.\n\n**2. Upright Meaning**  \nCreativity, growth, and sensual fulfillment—the Empress embodies maternal care, artistic expression, and the generative power of life itself. She signals a period of flourishing abundance, whether in relationships, projects, or personal well-being, urging the querent to embrace pleasure, nurture others, and trust the natural cycles of growth. This card encourages active creation through embodied experience, grounding spiritual energy into tangible, beautiful forms, and honoring one's physical and emotional needs.\n\n**3. Reversed Meaning**  \nReversed, the Empress indicates neglect, creative block, or overindulgence—the querent may be smothering others, suppressing their own vitality, or becoming consumed by material excess without spiritual depth. It can point to fertility issues, stagnant projects, or a disconnection from nature and one's own body, often arising from self-doubt or fear of change. Alternatively, it warns of codependency, laziness, or using pleasure as escape, urging a return to balanced self-care and a conscious re-engagement with creative energy.", "4": "**1. Visual Description**  \nA stern, bearded man sits on a massive stone throne adorned with four ram heads, wearing a crown and heavy armor beneath a red robe. He holds an ankh-shaped scepter in one hand and an orb in the other, with a barren, mountainous landscape behind him. The throne’s rigid angles and the stark setting convey absolute authority, structure, and the disciplined enforcement of order.\n\n**2. Upright Meaning**  \nAuthority, structure, and paternal leadership—the Emperor represents the principle of law, governance, and rational control. He signals the need for clear boundaries, strategic planning, and decisive action, often indicating a period where stability is achieved through discipline and practical responsibility. This card urges the querent to take charge of their circumstances, establish rules, and rely on logic and experience rather than emotion, while reminding that true power serves protection and order, not tyranny.\n\n**3. Reversed Meaning**  \nReversed, the Emperor exposes rigid control, domination, or weak leadership—the querent may be overly authoritarian, micromanaging, or, conversely, lacking in structure and follow-through. It indicates rebellion against legitimate authority, misuse of power, or a breakdown of order due to stubbornness or fear of losing control. Alternatively, it points to paternal conflict, bureaucratic obstacles, or an inability to adapt, urging a reassessment of one's relationship with power and a flexible approach to governance.", "5": "**1. Visual Description**  \nA robed religious figure sits on a throne between two kneeling acolytes, wearing a triple crown and holding a triple cross scepter. His right hand raises in a traditional blessing gesture, and two crossed keys rest at his feet. The pillars behind him bear motifs of the Old and New Testaments, with a red and white robe symbolizing mercy and justice—representing institutional tradition, spiritual doctrine, and the transmission of sacred wisdom.\n\n**2. Upright Meaning**  \nTradition, education, and spiritual guidance—the Hierophant represents established systems of belief, formal learning, and the wisdom passed down through institutions. He signals the need for conformity, mentorship, or participation in structured rituals and communities, urging the querent to seek counsel from trusted teachers or adhere to time-honored principles. This card encourages commitment, shared values, and the search for deeper meaning through orthodox channels, reminding that collective wisdom offers stability and moral clarity.\n\n**3. Reversed Meaning**  \nReversed, the Hierophant indicates rebellion against convention, dogma, or outdated authority—the querent may feel constrained by rigid systems or reject institutional values without developing personal conviction. It warns of blind faith, hypocrisy among leaders, or misuse of tradition to suppress individuality. Alternatively, it points to unconventional spiritual paths, breakaway groups, or the need to trust one's inner authority over external doctrine, urging a critical examination of inherited beliefs and a courageous departure from the familiar.", "6": "**1. Visual Description**  \nA nude man and woman stand beneath a radiant angel (Raphael) in a sunlit garden, with the Tree of Life behind the woman and the Tree of Knowledge behind the man, a serpent coiled around the latter. A mountain peak rises between them in the distance, while flames of passion and divine light stream from above—symbolizing choice, union, and the harmonious integration of opposites under spiritual blessing.\n\n**2. Upright Meaning**  \nLove, harmony, and conscious choice—the Lovers represents profound connection, whether romantic, platonic, or spiritual, grounded in mutual respect and shared values. It signifies a pivotal decision that aligns personal integrity with relational commitment, urging the querent to choose from the heart while honoring reason. This card emphasizes partnership, attraction, and the alignment of individual paths into a unified direction, often heralding a milestone in relationships or a moral test that clarifies one's true priorities.\n\n**3. Reversed Meaning**  \nReversed, the Lovers indicates discord, imbalance, or difficult choices driven by fear or external pressure—the querent may face misalignment between head and heart, leading to indecision, infidelity, or toxic attachments. It warns of conditional love, communication breakdowns, or values that clash irreconcilably, urging a reassessment of whether the connection serves mutual growth. Alternatively, it points to avoidance of commitment, self-sabotage in relationships, or a need to resolve inner contradictions before seeking external union.", "7": "**1. Visual Description**  \nA crowned warrior stands within a chariot pulled by two sphinxes—one black, one white—facing opposite directions. He wears armor adorned with lunar and astrological symbols, holding no reins but a wand-like scepter, with a canopy of stars above and a walled city behind. The sphinxes' contrasting colors and the lack of visible reins emphasize inner control, willpower, and the mastery of opposing forces through focused intent.\n\n**2. Upright Meaning**  \nDetermination, victory, and self-discipline—the Chariot signifies the triumphant application of will to overcome obstacles and navigate conflict. It urges the querent to harness opposing emotions, instincts, or external pressures into a single, directed momentum toward a clear goal. This card represents movement, ambition, and the courage to take decisive action, reminding that true control lies not in eliminating opposition but in balancing and steering divergent energies with unwavering confidence.\n\n**3. Reversed Meaning**  \nReversed, the Chariot signals loss of control, aggression, or directionless effort—the querent may be overwhelmed by internal contradictions, reckless speed, or a will that dominates without wisdom, leading to burnout or collision. It indicates stalled progress, scattered focus, or an inability to reconcile competing demands, often arising from arrogance or emotional suppression. Alternatively, it points to defeat through overexertion or cowardice, urging a pause to realign intentions, reintegrate suppressed feelings, and choose a course that serves long-term rather than immediate conquest.", "8": "**1. Visual Description**  \nA serene woman in a flowing white robe gently closes the jaws of a lion, her hand resting on its mouth while the other holds its lower jaw, with an infinity symbol hovering above her head. A calm landscape of hills and trees stretches behind her, and a red sash encircles her waist—symbolizing the taming of raw instinct through compassion, patience, and inner fortitude rather than brute force.\n\n**2. Upright Meaning**  \nInner strength, courage, and graceful mastery over primal impulses—Strength represents the quiet power of persuasion, empathy, and self-control in overcoming challenges. It urges the querent to face fears, difficult emotions, or aggressive external forces with kindness and steady resolve, transforming confrontation into understanding. This card signals resilience born not from dominance but from authentic self-acceptance, reminding that true strength integrates the wild and the gentle, channeling passion into purposeful action without suppression.\n\n**3. Reversed Meaning**  \nReversed, Strength indicates weakness, self-doubt, or unbridled aggression—the querent may feel overwhelmed by anger, fear, or insecurity, losing composure or resorting to force that backfires. It warns of emotional instability, intimidation, or a failure to trust one's capacity to endure, often manifesting as passive surrender or tyrannical outbursts. Alternatively, it points to suppressed vitality or misplaced compassion that enables harm, urging a reclaiming of personal power through honest confrontation with inner shadows and a rebalancing of firmness with tenderness.", "9": "**1. Visual Description**  \nAn elderly bearded figure stands atop a snowy mountain peak, holding a staff in one hand and a lantern containing a six-pointed star in the other. He wears a grey hooded cloak that conceals his form, with the lantern casting light downward onto a narrow, winding path. The stark, isolated landscape and the solitary stance evoke withdrawal, introspection, and the search for inner truth away from worldly distractions.\n\n**2. Upright Meaning**  \nSolitude, introspection, and spiritual guidance—the Hermit signifies a deliberate retreat from external noise to seek wisdom through silence and inner reflection. It urges the querent to turn inward, reassess personal values, and rely on their own experience and intuition rather than external validation. This card signals a period of mentorship (either giving or receiving), patience, and the gradual illumination of hidden knowledge, reminding that true clarity comes from disciplined contemplation and the courage to walk one's unique path.\n\n**3. Reversed Meaning**  \nReversed, the Hermit indicates isolation, withdrawal, or misguided solitude—the querent may be avoiding connection out of fear, cynicism, or excessive introspection that paralyzes action. It warns of loneliness, rejection of guidance, or a refusal to share hard-won wisdom with others, often stemming from pride or unresolved bitterness. Alternatively, it points to restlessness, impatience with the introspective process, or a premature return to society without inner clarity, urging a balanced engagement between solitude and community, and a check against becoming a recluse or a dogmatic hermit.", "10": "**1. Visual Description**  \nA great wheel with three concentric circles—outer, middle, and inner—turns between four winged creatures in the corners (the fixed zodiac signs), with a sphinx perched atop, a serpent descending on the right, and Anubis or a jackal rising on the left. Hebrew and alchemical symbols mark the wheel’s rim, and a blue sky spans the background—representing cosmic cycles, fate, and the immutable laws of cause and effect.\n\n**2. Upright Meaning**  \nChange, destiny, and turning points—the Wheel of Fortune signifies the inevitable rise and fall of circumstances, reminding the querent that all experiences are part of a larger, meaningful pattern. It indicates a favorable shift, unexpected opportunity, or a karmic resolution that arrives beyond personal control, urging acceptance and adaptability to the flow of fortune. This card encourages trust in timing and divine order, emphasizing that every end births a new beginning, and that conscious awareness can align one with the wheel’s upward turn.\n\n**3. Reversed Meaning**  \nReversed, the Wheel signals bad luck, resistance to change, or a cycle of repeated misfortune—the querent may cling to outdated situations or feel victimized by forces they cannot influence, leading to stagnation or despair. It warns of disruptions, delays, or unforeseen setbacks that challenge one’s sense of security, often arising from a refusal to learn from past patterns. Alternatively, it points to the illusion of permanence, urging a release of attachment to outcomes and a recalibration toward proactive agency within the larger flow of fate.", "11": "**1. Visual Description**  \nA crowned figure sits on a stone throne between two pillars, holding a balanced sword in the right hand and a set of scales in the left, with a square amulet on their chest. Their eyes gaze directly forward, and a purple robe and red cloak drape over their form, with a veil or curtain behind them—representing objective judgment, fairness, and the precise weighing of truth against falsehood.\n\n**2. Upright Meaning**  \nJustice, truth, and accountability—this card signifies the application of impartial reason to restore balance, whether in legal matters, ethical decisions, or personal relationships. It urges the querent to take responsibility for their actions, examine all evidence dispassionately, and accept consequences with integrity. This card signals that fair resolution is imminent, provided one acts with honesty and clarity, reminding that true justice requires both discernment and the courage to cut through illusion with the sword of intellect.\n\n**3. Reversed Meaning**  \nReversed, Justice indicates dishonesty, bias, or unresolved guilt—the querent may face unfair treatment, legal delays, or self-deception that distorts their perception of right and wrong. It warns of manipulation, harsh judgment without compassion, or refusal to acknowledge one's own culpability, often leading to karmic imbalance. Alternatively, it points to indecision, procrastination in confronting hard truths, or a system that fails to protect the innocent, urging a re-evaluation of facts, a check against personal prejudice, and a commitment to transparent action that aligns with higher principles.", "12": "**1. Visual Description**  \nA figure hangs upside down from a T-shaped wooden cross or tree, one leg bent behind the other in a reversed \"4\" shape, with hands tied behind the back. A serene halo glows around their head, and a calm, grey-blue sky and still water surround them, with no signs of struggle—representing voluntary surrender, suspension, and a shift in perspective through patient endurance.\n\n**2. Upright Meaning**  \nSurrender, release, and enlightened perspective—the Hanged Man signifies a necessary pause where the querent must let go of control, suspend action, and view their situation from a completely different angle. It urges acceptance of delay, sacrifice, or apparent powerlessness as a path to deeper wisdom, reminding that true freedom often comes through yielding rather than resisting. This card signals a period of waiting, spiritual initiation, or letting go of old patterns, where the passive state reveals insights unavailable through active effort.\n\n**3. Reversed Meaning**  \nReversed, the Hanged Man indicates resistance, stagnation, or false martyrdom—the querent may be refusing to let go out of fear, ego, or rigidity, prolonging unnecessary suffering and paralysis. It warns of victim mentality, wasted effort, or a sacrifice that serves no genuine purpose, often stemming from an unwillingness to embrace change. Alternatively, it points to impatience, premature action that disrupts natural timing, or a mistaken belief that surrender equals weakness, urging a reassessment of whether the current suspension is transformative or merely avoidance, and a conscious pivot toward meaningful engagement.", "13": "**1. Visual Description**  \nA skeletal rider in black armor on a pale horse advances forward, carrying a black banner emblazoned with a white rose. Before them, a king lies dead, a bishop pleads, a woman looks away, and a child gazes in innocence, with a distant sun setting between two towers and a boat sailing on a river—representing the inescapable, transformative force of endings and rebirth.\n\n**2. Upright Meaning**  \nTransformation, closure, and necessary release—Death signifies the end of a major phase, relationship, or identity, clearing the way for new growth. It urges the querent to let go of what has outlived its purpose, accept the pain of loss as part of renewal, and trust that decay precedes regeneration. This card reminds that nothing is permanent, and that active surrender to change, however uncomfortable, allows the emergence of fresh possibilities and deeper authenticity.\n\n**3. Reversed Meaning**  \nReversed, Death indicates resistance to change, stagnation, or a desperate clinging to the past—the querent may avoid necessary endings out of fear, leading to prolonged decay, inertia, or repeated patterns of self-sabotage. It warns of emotional numbness, refusal to mourn, or a superficial attempt to preserve appearances while life force drains away. Alternatively, it points to a slow, agonizing transition instead of a clean cut, urging a courageous confrontation with what must be released, and a conscious choice to embrace metamorphosis rather than remain trapped in a living death.", "14": "**1. Visual Description**  \nA winged figure, often androgynous, stands with one foot on land and the other in shallow water, pouring a luminous liquid from one golden chalice to another, creating a steady stream between them. A bright halo or sun-like disc radiates behind their head, and a winding path leads toward a distant mountain peak, with iris flowers blooming nearby—representing balance, alchemy, and the harmonious blending of opposites.\n\n**2. Upright Meaning**  \nBalance, patience, and conscious moderation—Temperance signifies the art of integrating disparate elements (emotion and reason, material and spiritual, action and rest) into a unified, flowing whole. It urges the querent to practice self-control, adapt to changing circumstances with grace, and combine skills or resources in novel ways that create healing and synthesis. This card signals a period of steady progress, where compromise, temperance, and measured steps lead to enduring results, reminding that true mastery lies in the middle path and the patient refinement of raw potential.\n\n**3. Reversed Meaning**  \nReversed, Temperance indicates imbalance, excess, or discord—the querent may be overextending, ignoring boundaries, or forcing incompatible elements together without resolution, leading to chaos or burnout. It warns of impatience, hurried action that undermines quality, or a refusal to moderate desires and habits. Alternatively, it points to a lack of cohesion in relationships or projects, creative block from poor integration, or a spiritual disconnection from one's core values, urging a return to rhythmic discipline, honest assessment of what truly harmonizes, and a pause to recalibrate before proceeding.", "15": "**1. Visual Description**  \nA horned, winged, goat-like figure (Baphomet) sits on a cube-shaped altar, with a reversed pentagram on its forehead and a torch in its left hand. A nude male and female figure stand chained to the altar at the waist, their chains loose enough to remove, with bat-like wings and tails visible behind them. The background is dark and cavernous, conveying entrapment, materialism, and the illusion of bondage to base desires.\n\n**2. Upright Meaning**  \nMaterial attachment, illusion, and shadow urges—the Devil represents the seductive power of worldly pleasures, addiction, and self-imposed limitation. It urges the querent to examine where they feel trapped by fear, greed, lust, or dependency, reminding that the chains are voluntarily accepted and can be loosened through awareness. This card signals intense ambition, sexual attraction, or financial obsession, but always carries a warning: the apparent bondage is a mirror of inner enslavement, and liberation requires ruthless honesty about one's own complicity.\n\n**3. Reversed Meaning**  \nReversed, the Devil indicates breaking free, releasing toxic patterns, or reclaiming personal power—the querent begins to see through illusions of limitation and confronts their shadows with courage. It signals recovery from addiction, abusive relationships, or material obsession, often accompanied by a profound shift in values. Alternatively, it warns of rebellion that merely swaps one master for another, or a descent into cynicism, manipulation, or reckless hedonism after liberation, urging sustained vigilance, genuine inner work, and a clear distinction between healthy desire and destructive compulsion.", "16": "**1. Visual Description**  \nA tall stone tower perched on a rocky peak is struck by a lightning bolt from a dark, turbulent sky, its crown crumbling and flames erupting from multiple windows. Two human figures fall headlong from the tower, their arms and legs splayed outward, while small yellow sparks or droplets of fire rain down around them—representing sudden destruction, catastrophic revelation, and the violent collapse of false structures.\n\n**2. Upright Meaning**  \nSudden upheaval, crisis, and humbling truth—the Tower signifies the dramatic breakdown of illusions, institutions, or identities built on shaky foundations. It urges the querent to accept that destruction is necessary for genuine renewal, however painful, as the lightning exposes hidden corruption or complacency. This card signals an unavoidable shock—be it loss, betrayal, or a radical shift in perspective—that shatters pride and forces a return to raw authenticity, reminding that what falls was never truly secure.\n\n**3. Reversed Meaning**  \nReversed, the Tower indicates averted disaster, delayed reckoning, or resistance to necessary change—the querent may narrowly escape a catastrophe but remain trapped in the same outdated patterns, prolonging inner decay. It warns of suppressed crises, fear of truth, or an attempt to patch up ruins without addressing root causes, often leading to recurring instability. Alternatively, it points to a minor upheaval that brings relief rather than trauma, or a gradual awakening instead of a sudden fall, urging the querent to voluntarily dismantle defenses before they are forcibly demolished.", "17": "A naked woman kneels by a pool of water, one foot submerged in the water and the other on dry ground. She holds two jugs, pouring water onto the land and back into the pool. Above her hangs one large eight-pointed star, surrounded by seven smaller stars, radiating light over the landscape. Hills, trees, and a bird perched on a branch appear in the distance.\n\n---\n\nThe darkness has passed, and dawn is breaking. You are reconnecting with inner faith and universal support. After the storm, peace returns, confidence in the future is renewed, and inspiration and creativity flow. This is pure hope — trust your intuition, stay open, and direction will emerge naturally.\n\n---\n\nHope is blocked, confidence shaken, and connection to inner guidance lost. You feel lost, creatively drained, or hold unrealistic expectations. The star's light is not extinguished — only temporarily obscured by anxiety. Return to basics: breathe deeply, spend time alone, connect with nature. As long as today is even slightly better than yesterday, that is enough.\n", "18": "**1. Visual Description**  \nA full, pale yellow moon with a crescent within it hangs between two tall grey towers, with a distant path winding through a landscape toward them. A crayfish or scorpion emerges from a pool in the foreground, flanked by a domestic dog and a wild wolf howling upward, while dewdrops or tears of light fall from the moon—representing the subconscious, illusion, and the veiled threshold between waking and dreaming.\n\n**2. Upright Meaning**  \nIllusion, fear, and the hidden depths of the psyche—the Moon signifies a period of confusion, uncertainty, and submerged emotions where reality is distorted by anxiety, projection, or intuition that resists clear articulation. It urges the querent to navigate darkness with patience, trusting their instinct while remaining alert to deception, self-deception, and unresolved shadows. This card signals that answers lie not in forced clarity but in embracing the mysterious, the liminal, and the poetic, reminding that the journey through the night reveals truths that daylight cannot access.\n\n**3. Reversed Meaning**  \nReversed, the Moon indicates emerging clarity, dispelled fears, or the resolution of hidden anxieties—the querent begins to see through illusions and confront what was previously repressed, often leading to a release of paranoia or emotional release. It warns, however, of overcompensation through rigid rationality that denies the value of intuition, or a premature interpretation of ambiguous signs. Alternatively, it points to suppressed emotions erupting uncontrollably, deception being exposed, or a descent into deeper confusion if the querent avoids the inner work, urging a balanced integration of unconscious material with conscious awareness.", "19": "**1. Visual Description**  \nA radiant, life-giving sun shines in a bright blue sky, its rays depicted as flowing curves or straight beams, with a joyful child riding a white horse beneath a simple stone wall and a field of sunflowers. The child holds a red banner, and a serene landscape of green hills and blooming flowers stretches behind—representing vitality, clarity, and unshadowed celebration of life.\n\n**2. Upright Meaning**  \nJoy, success, and conscious awareness—the Sun signifies a period of warmth, vitality, and luminous clarity where obstacles dissolve and truth stands fully revealed. It urges the querent to embrace unabashed happiness, share their light openly, and trust in the fundamental goodness of their path. This card signals achievement, health, and emotional fulfillment, often marking a milestone or a union where the self is expressed without reservation, reminding that life’s simplest pleasures carry the deepest wisdom.\n\n**3. Reversed Meaning**  \nReversed, the Sun indicates diminished vitality, delayed success, or blocked optimism—the querent may feel overshadowed, pessimistic, or disconnected from sources of joy, often due to burnout, cynicism, or temporary setbacks. It warns of pride that prevents honest self-reflection, or an overemphasis on positivity that suppresses real feelings. Alternatively, it points to delays in achievements, superficial happiness, or a need for patience before full brightness returns, urging the querent to tend to their inner fire, assess what obscures their light, and trust that clouds are transient.", "20": "**1. Visual Description**  \nAn angel (Gabriel) hovers in the sky above, blowing a long trumpet from which a flag with a cross hangs, while a great flood of light or a crystalline resonance descends. Below, nude human figures of varying ages rise from stone coffins or open graves, arms lifted in awe and supplication, with a grey landscape of mountains and water behind them—representing the ultimate call to awaken, reckon, and transcend.\n\n**2. Upright Meaning**  \nJudgment, rebirth, and the call to higher purpose—this card signifies a pivotal moment of self-evaluation, where the querent hears a clear inner summons to leave behind past errors, forgive themselves and others, and step into a renewed identity. It urges honest assessment of one's life, acceptance of accountability, and the courage to respond to a spiritual or moral awakening. This signal often marks a decisive turning point, a release of guilt, or a public acknowledgment of one's true path, reminding that salvation lies not in external approval but in the authentic alignment of action with inner truth.\n\n**3. Reversed Meaning**  \nReversed, Judgment indicates self-doubt, refusal to heed inner calls, or a paralyzing fear of transformation—the querent may avoid responsibility, remain stuck in regret, or resist the profound change that life demands. It warns of harsh self-judgment, procrastination in making amends, or a deafness to one's own intuition, often leading to missed opportunities for renewal. Alternatively, it points to a verdict delayed, external condemnation, or a shallow repentance without genuine change, urging a return to honest introspection, release of shame, and a deliberate answer to the inner trumpet before circumstances force a harsher accounting.", "21": "**1. Visual Description**  \nA nude figure, often androgynous or female, dances within a large wreath or oval laurel crown, holding two wands or staves, with four living creatures in the corners—a man, an eagle, a lion, and a bull—representing the fixed zodiac signs. A serene landscape of mountains, sea, and sky fills the background, and the figure’s legs form a cross or one is crossed over the other—symbolizing completion, integration, and the harmonious union of all elements.\n\n**2. Upright Meaning**  \nFulfillment, completion, and cosmic unity—the World signifies the successful conclusion of a major life cycle, where the querent has integrated lessons from all aspects of experience and achieved a state of wholeness. It urges celebration, gratitude, and a sense of being fully present in one's power, signaling that goals are realized, relationships mature, and a new level of understanding is reached. This card reminds that every ending is a threshold, and that true completion opens the door to the next stage of evolution with grace and confidence.\n\n**3. Reversed Meaning**  \nReversed, the World indicates incomplete closure, delayed achievement, or a reluctance to let go of the finished—the querent may feel stuck at the finish line, unable to accept the outcome, or burdened by unfinished business that blocks forward movement. It warns of superficial success, unintegrated lessons, or a failure to recognize the totality of one's journey, often stemming from perfectionism or fear of the next step. Alternatively, it points to external obstacles, missed opportunities, or a cycle that requires revisiting before genuine resolution, urging the querent to review what remains unacknowledged, release attachment to finality, and trust that completion comes through acceptance, not control.", "22": "**1. Visual Description**  \nA single, leafy wooden staff or club emerges from a small, fluffy cloud against a clear sky, held in a hand that seems to grow out of the cloud itself, with a rugged landscape of hills, a castle, and a winding river visible far below. The staff is alive with fresh green shoots sprouting along its length, and the background is bathed in bright daylight—representing raw potential, creative spark, and the seed of action that springs from pure will.\n\n**2. Upright Meaning**  \nInspiration, initiative, and new creative ventures—the Ace of Wands signals a burst of energy, enthusiasm, or a powerful idea that demands immediate action. It urges the querent to seize the moment, trust their instinct, and channel this fiery impulse into tangible expression, reminding that this is the spark of growth that can ignite major change. This card represents opportunity, courage, and the beginning of a passionate endeavor, whether in career, art, or personal development, with no guarantee of outcome but full promise of vitality.\n\n**3. Reversed Meaning**  \nReversed, the Ace of Wands indicates blocked creativity, delayed beginnings, or a lack of drive—the querent may feel uninspired, hesitant, or overwhelmed by doubt, letting promising ideas wither before they take root. It warns of impulsiveness that lacks direction, wasted energy, or a false start that fizzles out quickly. Alternatively, it points to creative burnout, internal conflict, or external obstacles that prevent the spark from catching, urging a reassessment of motivation, a clearing of mental clutter, and a patient reconnection with what genuinely excites before attempting to launch.", "23": "**1. Visual Description**  \nA figure in a tunic stands on the battlements of a stone fortress or high terrace, holding a globe or orb in one hand and grasping a tall staff planted firmly on the ground with the other, while a second staff is secured to the wall beside them. A vast landscape of sea, hills, and distant shores stretches before them, and they gaze outward with a contemplative, assertive posture—representing personal authority, perspective, and the crossroads of choice.\n\n**2. Upright Meaning**  \nPlanning, foresight, and the courage to expand—the Two of Wands signifies the moment after initial inspiration when the querent must survey their options, weigh consequences, and commit to a long-term direction. It urges bold vision and the willingness to step beyond comfort zones, leveraging current resources and partnerships to explore new territory. This card signals that the foundations are secure, and the question is not *whether* to act but *how* and *when* to extend one's influence, reminding that true mastery requires both strategic patience and decisive enterprise.\n\n**3. Reversed Meaning**  \nReversed, the Two of Wands indicates indecision, poor planning, or fear of the unknown—the querent may feel stuck between options, paralyzed by analysis, or clinging to safety despite clear opportunity for growth. It warns of unrealistic expectations, overextension without preparation, or a failure to consult allies or share the burden. Alternatively, it points to a narrow perspective, restless dissatisfaction without action, or a premature departure from a stable situation, urging the querent to clarify goals, gather reliable information, and choose a course with confidence rather than remain suspended in uncertainty.", "24": "**1. Visual Description**  \nA figure in a flowing robe stands on a cliff or elevated shore, leaning on a staff with both hands, while two other staves are planted upright behind them, forming a triangular arrangement. A fleet of small ships sails on the open sea in the distance, and the sky is golden and expansive, with rolling hills and a river below—representing foresight, commerce, and the first fruits of expanded enterprise.\n\n**2. Upright Meaning**  \nProgress, vision, and the realization of early success—the Three of Wands signifies that the querent has moved beyond planning into active execution, with their efforts beginning to yield tangible results and new opportunities appearing on the horizon. It urges continued confidence, patience in awaiting outcomes, and the willingness to look further ahead, leveraging current momentum to explore partnerships or markets beyond familiar boundaries. This card signals leadership, trade, and the expansion of influence, reminding that standing firm in one’s vision invites the winds of fortune.\n\n**3. Reversed Meaning**  \nReversed, the Three of Wands indicates delays, dispersal of effort, or a reluctance to act on the vision—the querent may be waiting passively, distracted by multiple directions, or hindered by logistical obstacles and poor communication. It warns of overconfidence that overlooks risks, or a failure to maintain connections with collaborators, leading to missed arrivals or stalled projects. Alternatively, it points to frustration with the pace of growth, a narrowing of ambition after initial setbacks, or an unwillingness to leave the comfort of the shore, urging a reassessment of strategy, renewed communication with distant partners, and a decisive push beyond hesitation.", "25": "**1. Visual Description**  \nFour tall staves decorated with garlands of leaves and fruit stand upright in the foreground, forming a festive canopy or ceremonial archway, with a castle or estate visible behind them. Several figures (often townspeople or dancers) gather beneath or near the staves, celebrating with bouquets and lively movement, against a background of rolling hills and a bridge—representing harmony, welcome, and the solidification of community bonds.\n\n**2. Upright Meaning**  \nCelebration, stability, and joyful milestones—the Four of Wands signifies a time of harmony, often marking a homecoming, wedding, or communal achievement where hard work translates into shared enjoyment. It urges the querent to pause and appreciate the foundation they have built, whether in relationships, family, or career, and to open their doors to others. This card signals security, cooperation, and the integration of personal success into a supportive social fabric, reminding that true prosperity is measured by the warmth of the community one nurtures.\n\n**3. Reversed Meaning**  \nReversed, the Four of Wands indicates instability, friction, or delayed celebrations—the querent may face conflict within their home or community, a sense of rootlessness, or an inability to settle despite outward appearances. It warns of neglected foundations, broken agreements, or a premature rush toward celebration that masks underlying tension. Alternatively, it points to exclusion, discomfort with group dynamics, or a reluctance to commit to a shared space, urging the querent to address relational rifts, define their personal sense of belonging, and establish genuine stability before inviting others in.", "26": "**1. Visual Description**  \nFive young men or figures, each holding a thick staff, clash with one another in a chaotic, interwoven struggle, with no clear opponent or objective—their staves cross and tangle in midair, and the ground beneath them is bare or rough. There is no specific setting beyond a plain background, emphasizing the sheer energy of conflict, competition, and overlapping wills.\n\n**2. Upright Meaning**  \nConflict, competition, and divergent agendas—the Five of Wands signifies a period of friction, where egos, ideas, or strategies collide without clear resolution. It urges the querent to recognize that such tension can be productive, forcing refinement of goals, strengthening of arguments, and clarification of boundaries, provided it remains constructive rather than destructive. This card signals rivalry, legal disputes, or creative clashes, reminding that the chaos is often external and temporary, and that healthy competition can sharpen skills if one avoids taking attacks personally.\n\n**3. Reversed Meaning**  \nReversed, the Five of Wands indicates internal conflict, truce, or exhausted strife—the querent may be turning aggression inward, causing self-doubt or burnout, or the external battle may have subsided into uneasy silence. It warns of passive-aggression, unresolved resentment, or a descent into petty squabbles that drain energy without advancing anyone. Alternatively, it points to a settlement, avoidance of necessary confrontation, or a loss of healthy competitive spirit, urging the querent to address root causes of conflict, choose battles wisely, and seek synthesis rather than victory for its own sake.", "27": "**1. Visual Description**  \nA victorious rider on a white horse rides through a crowd of cheering figures, holding a single staff topped with a laurel wreath, while five other staves are carried by the surrounding supporters. The rider wears a laurel crown, and the landscape behind them opens into a bright, sunny horizon with rolling hills and trees—representing public recognition, triumph, and the visible rewards of success.\n\n**2. Upright Meaning**  \nRecognition, confidence, and public acclaim—the Six of Wands signifies a clear victory, where the querent's efforts are acknowledged by others, boosting morale and reputation. It urges the querent to accept praise graciously, lead with conviction, and use their influence to inspire and unite followers. This card signals progress, promotions, or successful completion of a competitive endeavor, reminding that visible success is not just personal but also a responsibility to those who have supported the journey.\n\n**3. Reversed Meaning**  \nReversed, the Six of Wands indicates delayed recognition, hubris, or a hollow victory—the querent may be chasing external validation at the expense of inner integrity, or facing jealousy, criticism, and falling from grace. It warns of overconfidence, arrogance that alienates allies, or a triumph that proves temporary or undeserved. Alternatively, it points to setbacks, a lack of support, or a failure to communicate one's achievements effectively, urging a recalibration of expectations, a check against pride, and a refocus on genuine merit rather than applause.", "28": "**1. Visual Description**  \nA lone figure stands on a raised or uneven ground, holding a large staff with both hands, while six other staves appear to rise from below or point upward from a lower level, as if emerging from a crowd or hillside. The figure braces against the onslaught, their posture defensive yet resolute, with a clear sky behind them—representing standing one's ground against multiple pressures or opponents.\n\n**2. Upright Meaning**  \nCourage, defense, and perseverance under pressure—the Seven of Wands signifies a situation where the querent must defend their position, beliefs, or achievements against skepticism, competition, or external challenges. It urges assertiveness, resilience, and the willingness to hold firm even when outnumbered, reminding that the high ground offers strategic advantage. This card signals that opposition is manageable with confidence and that every successful stand strengthens one's authority and self-trust.\n\n**3. Reversed Meaning**  \nReversed, the Seven of Wands indicates overwhelm, retreat, or misguided defensiveness—the querent may feel besieged by real or imagined threats, leading to exhaustion, paranoia, or a surrender of hard-won ground. It warns of stubbornness that refuses useful compromise, or a defensive posture that becomes self-isolating and drains energy. Alternatively, it points to internal doubts that undermine resolve, a loss of advantage, or a situation where the querent is overestimating the opposition, urging a reassessment of the actual level of threat, a strategic retreat when beneficial, and a clear distinction between principled defense and prideful resistance.", "29": "**1. Visual Description**  \nEight straight, identical staves fly rapidly through a bright, open sky in a diagonal formation, their tips pointing forward as if shot from a single bow. The background is a clear, sunny landscape with rolling hills, a river, and distant mountains, but no human figures appear—emphasizing sheer motion, speed, and the unmediated force of events in motion.\n\n**2. Upright Meaning**  \nSpeed, action, and swift alignment—the Eight of Wands signifies a sudden burst of momentum, where plans accelerate, communications arrive, and events move quickly toward resolution. It urges the querent to seize the moment, act decisively, and trust that forward motion carries its own clarity, as delays and obstacles are swept aside. This card signals travel, news, or rapid progress, reminding that the arrow, once loosed, cannot be recalled, and that alignment of intention with external circumstances creates a near-inevitable trajectory.\n\n**3. Reversed Meaning**  \nReversed, the Eight of Wands indicates delays, friction, or misdirected energy—the querent may face obstacles, missed connections, or a sense of being overwhelmed by too many tasks arriving at once, leading to scattered focus. It warns of haste that produces errors, poor timing, or a lack of grounding that makes action ineffective. Alternatively, it points to stalled projects, communication breakdowns, or a need to reassess priorities before accelerating again, urging the querent to pause, clear channels, and ensure that the direction is correct before applying full force.", "30": "**1. Visual Description**  \nA weary, bandaged figure stands leaning on a single staff, with eight other staves planted upright in a defensive row behind them, forming a barrier or fence. The figure looks over their shoulder or directly ahead with guarded suspicion, their face marked by exhaustion and resilience, against a barren, grey landscape and a cloudy sky—representing the aftermath of sustained struggle and the instinct to protect what remains.\n\n**2. Upright Meaning**  \nResilience, vigilance, and defensive endurance—the Nine of Wands signifies a stage where the querent has endured repeated trials, is wounded but still standing, and must muster the last reserves of strength to hold their ground. It urges caution, preparedness, and a refusal to surrender, reminding that the final push often requires more grit than the first. This card signals a situation where trust has been eroded but the goal is near, encouraging the querent to set boundaries, conserve energy, and not let past injuries dictate future openness.\n\n**3. Reversed Meaning**  \nReversed, the Nine of Wands indicates paranoia, exhaustion, or a collapse of defensive walls—the querent may be overreacting to minor threats, isolating themselves out of fear, or finally breaking down after prolonged strain. It warns of rigidity that prevents timely retreat or help, or a situation where the querent's vigilance has become self-defeating. Alternatively, it points to the release of burdens, a decision to lay down arms, or the discovery that the perceived enemy was never there, urging a realistic assessment of actual dangers, permission to rest, and a willingness to let go of unnecessary defenses.", "31": "**1. Visual Description**  \nA figure bent under the immense weight of ten large staves, clutched awkwardly in both arms and piled against the body, obscuring their face and torso. The figure trudges forward with visible strain, while a small house or village appears in the near distance, suggesting that release or rest is close but not yet reached. The sky is overcast, and the ground is uneven—representing oppressive burden, overcommitment, and the cost of excessive responsibility.\n\n**2. Upright Meaning**  \nOverwhelm, sacrifice, and the weight of too many obligations—the Ten of Wands signifies a point where the querent has taken on more than they can sustainably carry, often out of duty, ambition, or an inability to delegate. It urges a recognition of diminishing returns, a reassessment of priorities, and the courage to set down tasks that no longer serve the core goal. This card signals that the end of the struggle is visible, but only if the querent consciously releases what is excessive, reminding that endurance without wisdom becomes self-sabotage.\n\n**3. Reversed Meaning**  \nReversed, the Ten of Wands indicates burnout, collapse, or a final release from burdens—the querent may have already broken under the strain, or is on the verge of a necessary breakdown that forces change. It warns of refusal to let go despite clear signs of exhaustion, leading to physical or emotional breakdown. Alternatively, it points to delegation, recovery, or a sudden dropping of responsibilities that brings relief but also guilt, urging a deliberate distribution of tasks, honest communication about limits, and a redefinition of success that includes well-being.", "32": "**1. Visual Description**  \nA youthful figure stands on a barren or slightly grassy hill, holding a single staff upright with both hands, wearing a tunic decorated with salamanders or small flame-like motifs. They gaze at the staff with curiosity and wonder, as if studying it, while a distant landscape of hills and a clear sky stretches behind them—representing the eager, untested phase of a new idea or quest.\n\n**2. Upright Meaning**  \nEnthusiasm, exploration, and the early spark of creative potential—the Page of Wands signifies a period of fresh curiosity, where the querent is inspired to begin a new study, project, or journey but has not yet developed skill or direction. It urges openness to learning, playful experimentation, and a willingness to embrace the unknown without pressure for immediate mastery. This card signals messages, news of opportunity, or the arrival of a youthful, passionate energy in one's life, reminding that beginnings are fragile and require nurturing rather than premature judgment.\n\n**3. Reversed Meaning**  \nReversed, the Page of Wands indicates impulsiveness, scattered energy, or lack of follow-through—the querent may start many things but finish few, driven by novelty rather than genuine commitment. It warns of immature enthusiasm that ignores practicalities, or news that proves unreliable and disappointing. Alternatively, it points to boredom, creative block, or a fear of taking the first step due to self-doubt, urging a grounding of excitement with patience, honest assessment of resources, and the discipline to channel raw energy into a sustained effort.", "33": "**1. Visual Description**  \nA knight in full armor rides a galloping horse across a dry, open plain, raising a single staff with leaves sprouting from its top, their cloak streaming behind them. The horse is charged and active, with hooves barely touching the ground, and the sky is warm and bright, with pyramids or distant mountains on the horizon—representing dynamic action, adventure, and the forceful pursuit of goals.\n\n**2. Upright Meaning**  \nEnergy, boldness, and swift initiative—the Knight of Wands signifies a period of passionate, confident action where the querent charges ahead with charisma and determination, often leaving caution behind. It urges decisive movement, risk-taking, and the embrace of new challenges with full commitment, reminding that momentum and conviction can override obstacles. This card signals travel, entrepreneurship, or a persuasive leader entering one's life, but carries a caution against recklessness and a need to sustain the course once the initial thrill fades.\n\n**3. Reversed Meaning**  \nReversed, the Knight of Wands indicates impulsiveness, aggression, or scattered force—the querent may act without foresight, dominating others with their energy, or abandon projects mid-way for the next exciting pursuit. It warns of burnout from overexertion, conflicts arising from hot-headedness, or a situation where enthusiasm outruns competence. Alternatively, it points to delays, blocked movement, or a knight whose fiery drive has turned to frustration or resentment, urging a tempering of passion with strategy, a check against arrogance, and a commitment to seeing through what has been started.", "34": "**1. Visual Description**  \nA regal, self-assured woman sits on a throne adorned with lions and salamanders, holding a tall staff topped with a sunflower or a stylized flame in her right hand, while her left hand rests on the throne's arm. She wears a golden crown and a rich robe, and behind her stretches a landscape of desert, pyramids, and fiery, vibrant skies—representing the confident, magnetic mastery of creative and social energy.\n\n**2. Upright Meaning**  \nVitality, confidence, and charismatic leadership—the Queen of Wands signifies a person who exudes warmth, determination, and independence, channeling passion with grace and generosity. It urges the querent to embrace their own power, inspire others through enthusiasm, and balance action with emotional intelligence. This card signals success in social and creative arenas, where the querent's magnetism attracts support and opportunities, reminding that true leadership is both fierce and compassionate, rooted in self-belief and the ability to uplift others.\n\n**3. Reversed Meaning**  \nReversed, the Queen of Wands indicates arrogance, manipulation, or overbearing energy—the querent may be domineering, attention-seeking, or using charm to control others, often masking insecurity with grandiosity. It warns of jealousy, vanity, or a tendency to burn out through excessive intensity, as well as conflicts arising from perceived competition. Alternatively, it points to a loss of confidence, creative blockage, or withdrawal from social engagement, urging a reassessment of motives, a cultivation of genuine self-worth not reliant on external admiration, and a return to the inclusive, nurturing aspects of leadership.", "35": "**1. Visual Description**  \nA mature, bearded king sits on a high-backed throne, holding a staff topped with a stylized flame or leaf in one hand, while a salamander or lion motif appears on the throne's arm. He wears a golden crown and a fiery orange or red robe, with a rugged landscape of mountains and a bright sky behind him, facing forward with a steady, commanding gaze—representing authoritative mastery, visionary leadership, and the full integration of will with experience.\n\n**2. Upright Meaning**  \nMastery, vision, and mature leadership—the King of Wands signifies a person who has fully developed their creative and executive capacities, wielding power with strategic confidence, charisma, and long-term perspective. It urges the querent to take charge of their domain, inspire others through clear direction, and balance bold initiative with the wisdom of experience. This card signals entrepreneurial success, political acumen, or mentorship, reminding that true kingship involves nurturing growth in others while maintaining unwavering focus on the larger vision.\n\n**3. Reversed Meaning**  \nReversed, the King of Wands indicates tyranny, rigid ego, or abuse of authority—the querent may be overbearing, dictatorial, or using power to suppress rather than enable, often driven by fear of losing control. It warns of arrogance that alienates allies, reckless decisions born of impatience, or a leader whose vision has become narcissistic. Alternatively, it points to a weak or absent authority, indecisive leadership, or burnout that undermines effectiveness, urging a return to humility, collaborative governance, and a clear distinction between commanding respect and demanding submission.", "36": "**1. Visual Description**  \nA single golden or ornate chalice appears from a billowing white cloud, held by a hand that emerges from the same cloud, with five streams of water flowing from the cup into a large body of water below. A dove descends into the cup, carrying a wafer or host, and water lilies or lotus flowers float on the surface, while a serene landscape of green hills and a clear sky stretches beyond—representing pure emotional offering, divine love, and the birth of deep feeling.\n\n**2. Upright Meaning**  \nLove, emotional openness, and new beginnings in relationships—the Ace of Cups signifies the initiation of a heartfelt connection, whether romantic, platonic, or spiritual, where feelings flow freely and unconditionally. It urges the querent to open their heart, receive love graciously, and trust the intuitive pull toward intimacy and compassion. This card signals creative inspiration, reconciliation, or a profound emotional offering, reminding that the cup is full and must be shared to maintain its abundance.\n\n**3. Reversed Meaning**  \nReversed, the Ace of Cups indicates blocked emotions, creative drought, or an inability to give or receive love—the querent may be holding back due to fear, past hurt, or emotional exhaustion, leading to a sense of emptiness or
